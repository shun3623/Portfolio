<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO | 金子 舜</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.75);
            --text-color: #e6edf3;
            --sub-text: #8b949e;
            --accent-blue: #79c0ff;
            --accent-purple: #d2a8ff;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-glow: rgba(121, 192, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.7;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(210, 168, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(121, 192, 255, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-color);
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ヘッダー部分 */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2px;
            background: linear-gradient(135deg, var(--text-color), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--accent-blue);
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* セクション共通スタイル */
        section {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 35px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            transition: border-color 0.3s ease;
        }

        section:hover{
            border-color: var(--border-grow);
        }

        h2 {
            font-size: 1.35rem;
            color: var(--text-color);
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 12px;
            margin-bottom: 24px;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before{
            content: '';
            display: inline-block;
            width: 8px;
            height: 18px;
            background: linear-gradient(to bottom, var(--accent-purple), var(--accent-blue));
            border-radius: 4px;
        }

        /* 学歴スタイル */
        .education-list {
            list-style: none;
        }

        .education-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.95rem;
        }

        .education-item:last-child {
            border-bottom: none;
        }

        .date {
            color: var(--sub-text);
            font-size: 0.88rem;
        }

        /* 制作物カードスタイル */
        .project-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            background-color: rgba(13,17,23,0.6);
        }

        .project-card:last-child {
            margin-bottom: 0;
        }

        .project-title {
            font-size: 1.2rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .project-desc {
            color: var(--sub-text);
            margin-bottom: 18px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .video-container {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border-color);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 1px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--accent-blue);
            color: var(--bg-color);
            box-shadow: 0 0 12px rgba(121,192,255,0.4);
        }

        footer {
            text-align: center;
            color: var(--sub-text);
            font-size: 0.8rem;
            margin-top: 50px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <h1>金子 舜</h1>
            <p class="subtitle">Game Programmer</p>
        </header>

        <!-- メインコンテンツ -->
         <main>
            <!-- 学歴 -->
            <section>
                <h2>学歴</h2>
                <ul class="education-list">
                    <li class="education-item">
                        <span class="school">KCS北九州情報専門学校 大学併修課 卒業</span>
                        <span class="date">2025年3月</span>
                    </li>
                    <li class="education-item">
                        <span class="school">バンタンゲームアカデミー福岡校 在学中</span>
                        <span class="date">2025年4月～現在</span>
                    </li>
                </ul>
            </section>

            <!-- 制作物 -->
            <section>
                <h2>制作物</h2>

            </section>
         </main>

         <footer>
            <p>&copy; 2026 Shun Kaneko. All Rights Reserved.</p>
         </footer>
    </div>

</body>
</html>
