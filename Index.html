<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ | 金子 舜</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --sub-text: #666666;
            --accent-color: #0366d6;
            --border-color: #e1e4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 0;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--sub-text);
            font-size: 1.1rem;
        }

        section {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .education-list {
            list-style: none;
        }

        .education-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .education-item:last-child {
            border-bottom: none;
        }

        .date {
            color: var(--sub-text);
            font-weight: bold;
        }

        /* 作品カードスタイル */
        .project-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
            background-color: #fafbfc;
        }

        .project-card:last-child {
            margin-bottom: 0;
        }

        .project-title {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .project-desc {
            color: var(--sub-text);
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            color: var(--sub-text);
            font-size: 0.85rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <h1>金子 舜</h1>
            <p class="subtitle">Game Programmer</p>
        </header>

        <section>
            <h2>学歴</h2>
            <ul class="education-list">
                <li class="education-item">
                    <span class="school">KCS北九州情報専門学校 大学併修課 卒業</span>
                    <span class="date">2025年3月</span>
                </li>
                <li class="education-item">
                    <span class="school">バンタンゲームアカデミー福岡校 在学中</span>
                    <span class="date">2025年4月～現在</span>
                </li>
            </ul>
        </section>

        <section>
            <h2>制作物</h2>
            <!-- ここに作品カードを追加していきます -->
        </section>

    </div>

</body>
</html>
